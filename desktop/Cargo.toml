[package]
name = "report-bot-app"
version = "0.1.0"
description = "The weekly report bot, running on this computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
sha2 = "=0.10.9"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-opener = "=2.7.2"
serde_json = "1"
ureq = "=2.12.1"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

# the deep link plugin builds rust-ini's options with the two fields 0.21.1 has, 0.21.2 added two more it does not set
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
