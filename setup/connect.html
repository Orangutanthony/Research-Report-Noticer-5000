<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAAG Bot</title>
<link rel="icon" type="image/png" href="/setup/static/favicon.png">
<link rel="stylesheet" href="/setup/static/style.css">
<script src="/setup/static/connect.js" defer></script>
</head>
<body>
<main>
  <h1 class="title"><img src="/setup/static/noticer.png" alt="" width="64" height="64">Configure Weekly Report Bot</h1>
  <form id="connect" class="step">
    <h2>Connect the app</h2>
    <p class="muted">On the setup page, pick "" and press Connect the app. If this page opened instead, paste the key shown there.</p>
    <label for="key">App key</label>
    <input id="key" autocomplete="off" spellcheck="false">
    <p class="status bad" id="error" role="status"></p>
    <button type="submit">Connect</button>
  </form>
</main>
</body>
</html>
